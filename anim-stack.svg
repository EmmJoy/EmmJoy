<g class="R" style="animation-delay:1s"><rect class="c" x="246" y="196" width="106" height="32" rx="8"/><text class="k" x="299" y="217">TypeScript</text></g>
<g class="R" style="animation-delay:1.1s"><rect class="c" x="362" y="196" width="67" height="32" rx="8"/><text class="k" x="395" y="217">React</text></g>
<g class="R" style="animation-delay:1.2s"><rect class="c" x="439" y="196" width="82" height="32" rx="8"/><text class="k" x="480" y="217">Next.js</text></g>
<g class="R" style="animation-delay:1.3s"><rect class="c" x="531" y="196" width="74" height="32" rx="8"/><text class="k" x="568" y="217">Blazor</text></g>
<g class="R" style="animation-delay:1.4s"><rect class="c" x="615" y="196" width="90" height="32" rx="8"/><text class="k" x="660" y="217">Tailwind</text></g>

<g class="L" style="animation-delay:.85s"><text class="l" x="30" y="270">TOOLS</text></g>
<g class="R" style="animation-delay:1.1s"><rect class="c" x="130" y="248" width="51" height="32" rx="8"/><text class="k" x="155" y="269">Git</text></g>
<g class="R" style="animation-delay:1.2s"><rect class="c" x="191" y="248" width="74" height="32" rx="8"/><text class="k" x="228" y="269">GitHub</text></g>
<g class="R" style="animation-delay:1.3s"><rect class="c" x="275" y="248" width="74" height="32" rx="8"/><text class="k" x="312" y="269">Docker</text></g>
<g class="R" style="animation-delay:1.4s"><rect class="c" x="359" y="248" width="82" height="32" rx="8"/><text class="k" x="400" y="269">Postman</text></g>
<g class="R" style="animation-delay:1.5s"><rect class="c" x="451" y="248" width="67" height="32" rx="8"/><text class="k" x="484" y="269">Azure</text></g>
</svg>
