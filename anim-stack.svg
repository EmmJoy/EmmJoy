<g class="L" style="animation-delay:.55s"><text class="l" x="30" y="166">DATABASE</text></g>
<g class="R" style="animation-delay:.7s"><rect class="c" x="130" y="144" width="106" height="32" rx="8"/><text class="k" x="183" y="165">SQL Server</text></g>
<g class="R" style="animation-delay:.8s"><rect class="c" x="246" y="144" width="106" height="32" rx="8"/><text class="k" x="299" y="165">PostgreSQL</text></g>
