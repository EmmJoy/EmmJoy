<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#512BD4"/><stop offset="1" stop-color="#00D4FF"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.t{fill:#e6edf3}.m{fill:#8b949e}
@keyframes inL{0%{transform:translateX(-120px);opacity:0}5%{transform:translateX(0);opacity:1}93%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes inR{0%{transform:translateX(120px);opacity:0}5%{transform:translateX(0);opacity:1}93%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes grow{0%{transform:scaleX(0);opacity:1}6%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.L{animation:inL 14s cubic-bezier(.2,.8,.2,1) infinite both}
.R{animation:inR 14s cubic-bezier(.2,.8,.2,1) infinite both}
.G{transform-origin:0 0;animation:grow 14s ease-out infinite both}
.card{fill:#0d1117;stroke:#30363d}
.tag{fill:#161b22;stroke:#30363d}
.n{fill:#e6edf3;font-size:17px;font-weight:700}
.d{fill:#8b949e;font-size:13px}
.s{fill:#e6edf3;font-size:11.5px}
</style>
<g class="L"><rect x="14" y="16" width="5" height="30" rx="2.5" fill="url(#g)"/>
<text x="30" y="38" class="t" font-size="26" font-weight="700">Featured Projects</text>
<text x="30" y="58" class="m" font-size="13">Things I have built</text></g>
<rect class="G" x="14" y="70" width="772" height="2" rx="1" fill="url(#g)" opacity=".7"/>

<g class="L" style="animation-delay:.4s">
<rect class="card" x="14" y="92" width="378" height="130" rx="12"/>
<rect x="14" y="92" width="378" height="4" rx="2" fill="url(#g)"/>
<text class="n" x="34" y="130">DentLab-OS</text>
<text class="d" x="34" y="156">Laravel 12 app for managing a dental lab</text>
<text class="d" x="34" y="174">with Admin and Lab Technician roles.</text>
<rect class="tag" x="34" y="186" width="138" height="24" rx="12"/>
<circle cx="48" cy="198" r="4" fill="#f7523f"/>
<text class="s" x="58" y="202">Laravel / Blade</text>
</g>

<g class="R" style="animation-delay:.65s">
<rect class="card" x="408" y="92" width="378" height="130" rx="12"/>
<rect x="408" y="92" width="378" height="4" rx="2" fill="url(#g)"/>
<text class="n" x="428" y="130">Warehouse-Management-System</text>
<text class="d" x="428" y="156">Java system for managing warehouse</text>
<text class="d" x="428" y="174">inventory and operations.</text>
<rect class="tag" x="428" y="186" width="58" height="24" rx="12"/>
<circle cx="442" cy="198" r="4" fill="#b07219"/>
<text class="s" x="452" y="202">Java</text>
</g>

<g class="L" style="animation-delay:.9s">
<rect class="card" x="14" y="242" width="378" height="130" rx="12"/>
<rect x="14" y="242" width="378" height="4" rx="2" fill="url(#g)"/>
<text class="n" x="34" y="280">C_Sharp_Project</text>
<text class="d" x="34" y="306">C# project built on .NET fundamentals.</text>
<text class="d" x="34" y="324">Console and OOP concepts.</text>
<rect class="tag" x="34" y="336" width="44" height="24" rx="12"/>
<circle cx="48" cy="348" r="4" fill="#178600"/>
<text class="s" x="58" y="352">C#</text>
</g>

<g class="R" style="animation-delay:1.15s">
<rect class="card" x="408" y="242" width="378" height="130" rx="12"/>
<rect x="408" y="242" width="378" height="4" rx="2" fill="url(#g)"/>
<text class="n" x="428" y="280">Computer_Graphics_Project</text>
<text class="d" x="428" y="306">Computer graphics project exploring</text>
<text class="d" x="428" y="324">rendering and visual programming.</text>
<rect class="tag" x="428" y="336" width="87" height="24" rx="12"/>
<circle cx="442" cy="348" r="4" fill="#00D4FF"/>
<text class="s" x="452" y="352">Graphics</text>
</g>
</svg>
